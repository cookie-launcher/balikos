LABEL arch_nbd
TEXT HELP
Boot the BalıkOS live medium using NBD.
It allows you to install BalıkOS or perform system maintenance.
ENDTEXT
MENU LABEL BalıkOS live medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-balikos-kernel
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-balikos-kernel.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

