name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balikos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel archiso git qemu-system-x86 \
            edk2-ovmf python rsync openssh squashfs-tools dosfstools mtools \
            syslinux grub sudo
          pacman -Scc --noconfirm
          rm -rf /usr/share/doc /usr/share/man

      - name: Create unprivileged builder
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages
        run: sudo -u builder ./scripts/build-packages.sh

      - name: Build ISO
        env:
          BALIKOS_ISO_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || '' }}
        run: ./scripts/build-iso.sh

      # QEMU on hosted runners normally has no KVM.  The smoke tests are
      # useful diagnostics, but a release must not be blocked by TCG timing.
      - name: BIOS boot smoke test
        continue-on-error: true
        run: ./scripts/test-iso-qemu.sh --bios

      - name: UEFI boot smoke test
        continue-on-error: true
        run: ./scripts/test-iso-qemu.sh --uefi

      - name: Split ISO for GitHub release asset limit
        run: |
          set -euo pipefail
          ISO="$(find out -maxdepth 1 -name '*.iso' | head -1)"
          test -n "$ISO"
          BASE="$(basename "$ISO")"
          split -b 1900M -d -a 2 "$ISO" "${ISO}.part-"
          (
            cd out
            sha256sum "$BASE" > "${BASE}.sha256"
            sha256sum "${BASE}.part-"* > "${BASE}.parts.sha256"
          )
          rm -rf work cache
          rm -f "$ISO"
          ls -lh out

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: balikos-iso
          compression-level: 0
          retention-days: 7
          path: |
            out/*.part-*
            out/*.sha256
            out/release.json
          if-no-files-found: error

      - name: Upload package repository
        uses: actions/upload-artifact@v4
        with:
          name: balikos-repo
          retention-days: 7
          path: repo/x86_64
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: balikos-iso
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: balikos-repo
          path: repo/x86_64

      - name: Verify split ISO
        run: |
          set -euo pipefail
          ISO_NAME="$(basename out/*.iso.sha256 .sha256)"
          cat out/*.part-* > "/tmp/${ISO_NAME}"
          EXPECTED="$(cut -d' ' -f1 "out/${ISO_NAME}.sha256")"
          ACTUAL="$(sha256sum "/tmp/${ISO_NAME}" | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
          echo "verified ${ISO_NAME}: ${ACTUAL}"

      - name: Package local repository
        run: |
          set -euo pipefail
          mkdir -p out
          tar -C repo -czf out/balikos-repo-x86_64.tar.gz x86_64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BalıkOS ${{ github.ref_name }}
          body: |
            BalıkOS ${{ github.ref_name }} — GitHub Release.

            ISO iki parça hâlinde yayınlanır (GitHub'ın 2 GiB asset sınırı):

                for f in balikos-*.iso.sha256; do
                  base="${f%.sha256}"
                  cat "${base}.part-"* > "$base"
                  sha256sum -c "$f"
                done

            Canlı oturum: `liveuser / live` (passwordless sudo), `root / root`.

            Bu sürümde BIOS + UEFI canlı boot, Calamares ile btrfs kurulum,
            BalıkOS markalaması, mavi accent, dört duvar kağıdı, Mağaza /
            Duvar Kağıtları / Hoş Geldiniz uygulamaları ve GDM düzeltmeleri
            bulunur.

            Kaynak ağacı ve test raporu: https://github.com/${{ github.repository }}

            Not: ISO remaster olduğu için çekirdek paketi hâlâ
            `linux-cachyos`; kaynak ağacındaki `balikos-kernel` bir sonraki
            derleme içindir.
          files: |
            out/*.part-*
            out/*.sha256
            out/release.json
            out/balikos-repo-x86_64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
